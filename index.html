<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صاحبي - روبوت الونسة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0f172a;height:100vh;display:flex;flex-direction:column}
header{background:#22c55e;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:bold}
header span{font-size:13px;display:block;font-weight:normal;opacity:.9}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.5}
.me{background:#22c55e;color:#fff;align-self:flex-end;border-bottom-left-radius:18px;border-bottom-right-radius:4px}
.bot{background:#fff;color:#111;align-self:flex-start;border-bottom-left-radius:4px;border-bottom-right-radius:18px}
#box{display:flex;padding:10px;background:#fff;gap:8px}
input{flex:1;padding:12px;border-radius:25px;border:1px solid #ddd;outline:none;font-size:16px}
button{background:#22c55e;color:#fff;border:none;padding:12px 20px;border-radius:25px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>🤖 صاحبي بوب<span>اونلاين • بيرد عليك بالسوداني</span></header>
<div id="chat"></div>
<div id="box">
<input id="inp" placeholder="اكتب لي... مثلا: السلام عليكم">
<button onclick="send()">إرسال</button>
</div>
<script>
let chat=document.getElementById('chat');
let inp=document.getElementById('inp');
function add(text,cls){let d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
add('أهلا بيك يا زول! 👋 أنا بوب صاحبك الجديد. أخبارك شنو؟ جرب تسألني: كيفك؟ بتحب شنو؟ زهجان؟','bot');
function reply(t){
 t=t.toLowerCase();
 if(t.includes('سلام')||t.includes('هلا')||t.includes('هاي')) return 'وعليكم السلام يا عسل! 😍 نورت والله، أخبارك شنو الليلة؟';
 if(t.includes('كيفك')||t.includes('اخبارك')||t.includes('كيف')) return 'أنا تمام والله الحمدلله، انت كيف؟ ان شاء الله مبسوط في بورتسودان؟ 🌊';
 if(t.includes('اسمك')) return 'اسمي بوب 🤖، صاحبك الروبوت السوداني، انت اسمك منو؟';
 if(t.includes('زهجان')||t.includes('ملل')||t.includes('طفشان')) return 'زهجان؟ تعال نلعب! قول لي نكتة ولا أسألني أي حاجة، ولا أحكي ليك نكتة؟ اكتب "نكتة"';
 if(t.includes('نكتة')) return 'مرة واحد عزابي مشى عيد الحب، قالوا ليهو جيب وردة، قال ليهم أنا الوردة زاتها 😂😂';
 if(t.includes('حب')||t.includes('عزاب')) return 'أهاااا 😏 وقعت ولا لسه؟ بكره عيد العزاب 11/11، انت جاهز ولا؟';
 if(t.includes('جوعان')||t.includes('اكل')||t.includes('جعان')) return 'جوعان؟ أمشي أضرب ليك فول مظبط ولا سمك في بورتسودان 🐟، أنا ذاتي جعت معاك!';
 if(t.includes('كورة')||t.includes('هلال')||t.includes('مريخ')) return 'كورة؟ 🔥 انت هلالابي ولا مريخابي؟ أنا بشجع الفريق البفوز بس 😂';
 if(t.includes('قراية')||t.includes('مدرسة')||t.includes('امتحان')) return 'القراية دايرة صبر يا فردة، أقرا شوية وارتاح شوية، وربنا يوفقك ان شاء الله 💪';
 if(t.includes('بحبك')||t.includes('بحب')) return 'وأنا كمان بحبك يا زول 🥹❤️ انت صاحبي المفضل';
 if(t.includes('باي')||t.includes('وداع')) return 'ما تمشي ياخ 😭 خليك شوية، لسه ما ونسنا!';
 if(t.includes('شكرا')||t.includes('تسلم')) return 'العفو يا زولي، ده واجبي 😎 أي خدمة تاني؟';
 let r=['والله كلامك سمح 😂 واصل واصل','ههههههه ضحكتني يا زول، تاني شنو؟','أها وبعدين؟ احكي لي زيادة 👀','يا سلام! انت زول مبدع والله، كمل','صدقني فهمتك، لكن احكي لي أكتر'];
 return r[Math.floor(Math.random()*r.length)];
}
function send(){
 let v=inp.value.trim(); if(!v) return;
 add(v,'me'); inp.value='';
 setTimeout(()=>{add(reply(v),'bot')},600);
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
